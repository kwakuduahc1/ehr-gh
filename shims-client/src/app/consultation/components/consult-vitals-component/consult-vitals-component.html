<h2 class="text-primary h2 text-center">Vital Signs</h2>
<table class="table table-striped table-secondary table-responsive">
    <thead>
        <tr>
            <th class="thead">Date</th>
            <th class="thead">Weight</th>
            <th class="thead">Temp</th>
            <th class="thead">BP</th>
            <th class="thead">Pulse</th>
            <th class="thead">Respiration</th>
            <th>Complains</th>
            <th>Notes</th>
        </tr>
    </thead>
    <tbody>
        @for (v of vitals(); track $index) {
        <tr>
            <td>{{v.dateSeen|date}}</td>
            <td>{{v.weight}}</td>
            <td>{{v.temperature}}</td>
            <td>{{v.systol}}/{{v.diastol}}</td>
            <td>{{v.pulse}}</td>
            <td>{{v.respiration}}</td>
            <td>{{v.complaints}}</td>
            <td>{{v.notes}}</td>
        </tr>
        }
</table>
